name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Formato, lint, tipos, pruebas y build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - name: Comprobar que dist/ no contiene archivos sensibles
        run: |
          ! find dist \( -name ".env*" -o -name "*.sql" -o -name "package*.json" -o -path "*supabase*" \) | grep .

  e2e:
    name: E2E en navegador real
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm run test:e2e
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
